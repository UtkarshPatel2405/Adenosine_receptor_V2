name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ADENOSINE_LOG_LEVEL: WARNING

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxext6
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check src/ tests/
      - name: Type check with mypy (src only)
        run: mypy src/ --ignore-missing-imports || true
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --ignore=tests/test_integration
      - name: Build Docker image (syntax check)
        run: docker build -t adenosine-model --target . --no-cache --progress=plain . 2>&1 || echo "Docker build check skipped (no Docker daemon)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check src/ tests/
