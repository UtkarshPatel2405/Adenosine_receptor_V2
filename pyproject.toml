[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "adenosine-selectivity-model"
version = "2.0.0"
description = "Publication-grade QSAR platform for adenosine receptor binding affinity and selectivity prediction"
authors = [{ name = "Utkarsh Patel" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "rdkit",
    "plotly",
    "matplotlib",
    "seaborn",
    "streamlit",
    "joblib",
    "py3Dmol",
    "mapie",
    "shap>=0.52.0",
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    "python-dotenv",
    "requests",
    "openpyxl",
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "mlflow",
    "optuna",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "BLE"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unreachable = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require trained models or data files",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "unwanted*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
