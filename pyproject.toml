[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "adenosine-receptor-profiler"
version = "2.0.0"
description = "QSAR platform for human adenosine receptor (A1, A2A, A2B, A3) binding affinity, selectivity, and conformal uncertainty prediction"
authors = [{ name = "Utkarsh Patel" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0.0,<3.0",
    "pandas>=2.2.0,<3.0",
    "scipy>=1.13.0,<2.0",
    "scikit-learn>=1.6.0,<2.0",
    "xgboost>=3.0.0,<4.0",
    "lightgbm>=4.5.0,<5.0",
    "mapie>=1.0.0,<2.0",
    "rdkit>=2024.09",
    "shap>=0.50.0,<1.0",
    "joblib>=1.3.0,<2.0",
    "openpyxl>=3.1.0,<4.0",
    "python-dotenv>=1.0.0,<2.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.30.0,<1.0",
]

[project.optional-dependencies]
train = [
    "optuna>=3.6.0,<5.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "BLE"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unreachable = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require trained models or data files",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
